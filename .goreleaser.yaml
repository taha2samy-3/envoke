# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: secrets-entrypoint

builds:
  - id: secrets-entrypoint
    binary: secrets-entrypoint
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos: [linux]
    goarch: [amd64, arm64]

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
  # Bare binaries too, so a consumer can `curl -Lo` one without untarring.
  - id: raw
    formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^Merge "

release:
  prerelease: auto
